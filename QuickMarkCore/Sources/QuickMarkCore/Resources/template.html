<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file: data:; media-src file: data:; font-src file: data:; style-src 'unsafe-inline'; script-src 'nonce-{{SCRIPT_NONCE}}'; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<title>{{TITLE}}</title>
<style>
/* ---------- Light theme variables (default) ---------- */
:root, .markdown-body {
  --fgColor-default: #1f2328;
  --fgColor-muted: #59636e;
  --fgColor-accent: #0969da;
  --bgColor-default: #ffffff;
  --bgColor-muted: #f6f8fa;
  --bgColor-neutral-muted: #818b981f;
  --borderColor-default: #d1d9e0;
  --borderColor-muted: #d1d9e0b3;
  --peekmark-chip-bg: #f6f8fa;
  --peekmark-chip-accent-bg: #ddf4ff;
  --peekmark-chip-accent-fg: #0969da;
  --peekmark-card-shadow: 0 12px 40px rgba(31, 35, 40, 0.08);
  --fontStack-monospace: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root, .markdown-body {
    --fgColor-default: #f0f6fc;
    --fgColor-muted: #9198a1;
    --fgColor-accent: #4493f8;
    --bgColor-default: #0d1117;
    --bgColor-muted: #151b23;
    --bgColor-neutral-muted: #656c7633;
    --borderColor-default: #3d444d;
    --borderColor-muted: #3d444db3;
    --peekmark-chip-bg: #151b23;
    --peekmark-chip-accent-bg: #112a46;
    --peekmark-chip-accent-fg: #79c0ff;
    --peekmark-card-shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}

/* ---------- Page chrome ---------- */
html, body {
  margin: 0;
  padding: 0;
  background-color: var(--bgColor-default);
  color: var(--fgColor-default);
}

/* ---------- Markdown body ---------- */
.markdown-body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 16px;
  line-height: 1.5;
  font-weight: 400;
  color: var(--fgColor-default);
  background-color: var(--bgColor-default);
  word-wrap: break-word;
  box-sizing: border-box;
  min-width: 200px;
  max-width: 980px;
  margin: 0 auto;
  padding: 45px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
@media (max-width: 767px) {
.markdown-body { padding: 15px; }
}

/* ---------- Preview Intelligence ---------- */
.peekmark-intelligence {
  border: 1px solid var(--borderColor-muted);
  background: linear-gradient(180deg, var(--bgColor-default), var(--bgColor-muted));
  border-radius: 14px;
  box-shadow: var(--peekmark-card-shadow);
  margin-bottom: 1rem;
  padding: 14px;
}
.peekmark-eyebrow {
  color: var(--fgColor-muted);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin-bottom: 0.65rem;
  text-transform: uppercase;
}
.peekmark-chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.peekmark-chip {
  align-items: center;
  background: var(--peekmark-chip-bg);
  border: 1px solid var(--borderColor-muted);
  border-radius: 999px;
  display: inline-flex;
  gap: 6px;
  max-width: 100%;
  min-height: 26px;
  padding: 3px 9px;
}
.peekmark-chip-key {
  color: var(--fgColor-muted);
  font-size: 0.72rem;
  font-weight: 650;
}
.peekmark-chip-value {
  color: var(--fgColor-default);
  font-size: 0.78rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.peekmark-chip-status,
.peekmark-chip-type {
  background: var(--peekmark-chip-accent-bg);
  border-color: transparent;
}
.peekmark-chip-status .peekmark-chip-value,
.peekmark-chip-type .peekmark-chip-value {
  color: var(--peekmark-chip-accent-fg);
  font-weight: 650;
}
.peekmark-toc-list {
  display: grid;
  gap: 3px;
}
.peekmark-toc-link {
  border-radius: 8px;
  color: var(--fgColor-muted);
  display: block;
  font-size: 0.85rem;
  line-height: 1.35;
  padding: 4px 8px;
}
.peekmark-toc-link:hover {
  background-color: var(--bgColor-neutral-muted);
  color: var(--fgColor-accent);
  text-decoration: none;
}
.peekmark-toc-level-2 { padding-left: 18px; }
.peekmark-toc-level-3,
.peekmark-toc-level-4,
.peekmark-toc-level-5,
.peekmark-toc-level-6 { padding-left: 30px; }
.peekmark-heading-anchor {
  color: var(--fgColor-muted);
  float: left;
  font-size: 0.75em;
  margin-left: -0.9em;
  opacity: 0;
  padding-right: 0.25em;
}
.markdown-body h1:hover .peekmark-heading-anchor,
.markdown-body h2:hover .peekmark-heading-anchor,
.markdown-body h3:hover .peekmark-heading-anchor,
.markdown-body h4:hover .peekmark-heading-anchor,
.markdown-body h5:hover .peekmark-heading-anchor,
.markdown-body h6:hover .peekmark-heading-anchor {
  opacity: 1;
}
.markdown-body a[href^="peekmark-wikilink://"] {
  background: var(--bgColor-neutral-muted);
  border: 1px solid var(--borderColor-muted);
  border-radius: 999px;
  color: var(--fgColor-accent);
  display: inline-block;
  font-size: 0.92em;
  padding: 0 0.45em;
}
.markdown-body a[href^="peekmark-wikilink://"]::before {
  content: "[[";
  color: var(--fgColor-muted);
}
.markdown-body a[href^="peekmark-wikilink://"]::after {
  content: "]]";
  color: var(--fgColor-muted);
}

/* ---------- Block rhythm ---------- */
.markdown-body p,
.markdown-body blockquote,
.markdown-body ul,
.markdown-body ol,
.markdown-body dl,
.markdown-body table,
.markdown-body pre,
.markdown-body details {
  margin-top: 0;
  margin-bottom: 1rem;
}
.markdown-body p { margin-bottom: 10px; }

/* ---------- Headings ---------- */
.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4,
.markdown-body h5,
.markdown-body h6 {
  font-weight: 600;
  line-height: 1.25;
  margin-top: 1.5rem;
  margin-bottom: 1rem;
}
.markdown-body h1 { font-size: 2em; }
.markdown-body h2 { font-size: 1.5em; }
.markdown-body h3 { font-size: 1.25em; }
.markdown-body h4 { font-size: 1em; }
.markdown-body h5 { font-size: 0.875em; }
.markdown-body h6 { font-size: 0.85em; color: var(--fgColor-muted); }
.markdown-body h1,
.markdown-body h2 {
  padding-bottom: 0.3em;
  border-bottom: 1px solid var(--borderColor-muted);
}

/* ---------- Code ---------- */
.markdown-body code,
.markdown-body tt {
  font-family: var(--fontStack-monospace);
  font-size: 85%;
  padding: 0.2em 0.4em;
  white-space: break-spaces;
  background-color: var(--bgColor-neutral-muted);
  border-radius: 6px;
}
.markdown-body pre {
  font-family: var(--fontStack-monospace);
  font-size: 85%;
  line-height: 1.45;
  padding: 1rem;
  overflow: auto;
  background-color: var(--bgColor-muted);
  border-radius: 6px;
  margin-bottom: 1rem;
}
.markdown-body pre code,
.markdown-body pre tt {
  font-size: 100%;
  padding: 0;
  background: transparent;
  border: 0;
  white-space: pre;
  word-break: normal;
  display: inline;
  overflow: visible;
  line-height: inherit;
}

/* ---------- Blockquote ---------- */
.markdown-body blockquote {
  padding: 0 1em;
  color: var(--fgColor-muted);
  border-left: 0.25em solid var(--borderColor-default);
}

/* ---------- Lists ---------- */
.markdown-body ul,
.markdown-body ol {
  padding-left: 2em;
}
.markdown-body li + li { margin-top: 0.25em; }
.markdown-body li > p { margin-top: 1rem; }
.markdown-body .task-list-item { list-style-type: none; }

/* ---------- Tables ---------- */
.markdown-body table {
  display: block;
  width: max-content;
  max-width: 100%;
  overflow: auto;
  border-collapse: collapse;
  font-variant: tabular-nums;
}
.markdown-body th,
.markdown-body td {
  padding: 6px 13px;
  border: 1px solid var(--borderColor-default);
}
.markdown-body th { font-weight: 600; }
.markdown-body tr:nth-child(2n) {
  background-color: var(--bgColor-muted);
}

/* ---------- Horizontal rule ---------- */
.markdown-body hr {
  height: 0.25em;
  margin: 1.5rem 0;
  background-color: var(--borderColor-default);
  border: 0;
}

/* ---------- Links ---------- */
.markdown-body a {
  color: var(--fgColor-accent);
  text-decoration: none;
}
.markdown-body a:hover {
  text-decoration: underline;
  text-underline-offset: 0.2rem;
}

/* ---------- Images ---------- */
.markdown-body img {
  max-width: 100%;
  box-sizing: content-box;
  border-style: none;
  background-color: transparent;
}

/* ---------- Mermaid diagrams ---------- */
.peekmark-mermaid {
  background: var(--bgColor-muted);
  border: 1px solid var(--borderColor-muted);
  border-radius: 10px;
  box-sizing: border-box;
  margin: 0 0 1rem;
  overflow: auto;
  padding: 1rem;
  text-align: center;
}
.peekmark-mermaid svg {
  height: auto;
  max-width: 100%;
}
.peekmark-mermaid-error .peekmark-mermaid {
  color: var(--fgColor-muted);
  font-family: var(--fontStack-monospace);
  text-align: left;
  white-space: pre-wrap;
}

/* ---------- highlight.js themes (inlined) ---------- */
{{HIGHLIGHT_LIGHT_CSS}}

@media (prefers-color-scheme: dark) {
  {{HIGHLIGHT_DARK_CSS}}
}

/* ---------- Optional local customization ---------- */
{{CUSTOM_CSS}}
</style>
</head>
<body>
<article class="markdown-body {{ARTICLE_CLASSES}}">
{{CONTENT}}
</article>
<script nonce="{{SCRIPT_NONCE}}">
{{HIGHLIGHT_JS}}
</script>
<script nonce="{{SCRIPT_NONCE}}">
{{MERMAID_JS}}
</script>
<script nonce="{{SCRIPT_NONCE}}">
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  svg: { fontCache: 'none' }
};
</script>
<script nonce="{{SCRIPT_NONCE}}">
{{MATHJAX_JS}}
</script>
<script nonce="{{SCRIPT_NONCE}}">
(function() {
  window.__quickMarkRenderState = { status: 'pending', errors: [] };

  function prepareMermaidBlocks() {
    document.querySelectorAll('pre > code.language-mermaid, pre > code.language-mmd').forEach(function(code, index) {
      var pre = code.parentElement;
      if (!pre) { return; }
      var diagram = document.createElement('div');
      diagram.className = 'peekmark-mermaid mermaid';
      diagram.textContent = code.textContent || '';
      diagram.setAttribute('data-peekmark-mermaid-index', String(index));
      pre.replaceWith(diagram);
    });
  }

  async function runMermaid() {
    prepareMermaidBlocks();
    if (typeof mermaid === 'undefined' || typeof mermaid.initialize !== 'function') { return; }
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    try {
      mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: dark ? 'dark' : 'default' });
      if (typeof mermaid.run === 'function') {
        await mermaid.run({ querySelector: '.peekmark-mermaid' });
      } else if (typeof mermaid.init === 'function') {
        await Promise.resolve(mermaid.init(undefined, document.querySelectorAll('.peekmark-mermaid')));
      }
    } catch (e) {
      document.documentElement.classList.add('peekmark-mermaid-error');
      window.__quickMarkRenderState.errors.push('mermaid');
    }
  }

  async function waitForMath() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      try {
        await window.MathJax.startup.promise;
      } catch (e) {
        window.__quickMarkRenderState.errors.push('math');
      }
    }
  }

  async function run() {
    if (typeof hljs !== 'undefined' && typeof hljs.highlightAll === 'function') {
      try { hljs.highlightAll(); } catch (e) { /* swallow */ }
    }
    try {
      await Promise.all([runMermaid(), waitForMath()]);
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      await new Promise(function(resolve) {
        var settled = false;
        function finish() {
          if (settled) { return; }
          settled = true;
          resolve();
        }
        setTimeout(finish, 80);
        requestAnimationFrame(function() { requestAnimationFrame(finish); });
      });
      window.__quickMarkRenderState.status = 'ready';
    } catch (e) {
      window.__quickMarkRenderState.status = 'failed';
      window.__quickMarkRenderState.errors.push('unexpected');
    }
    document.documentElement.setAttribute('data-quickmark-render-status', window.__quickMarkRenderState.status);
    window.dispatchEvent(new CustomEvent('quickmark-render-ready', {
      detail: window.__quickMarkRenderState
    }));
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { void run(); });
  } else {
    void run();
  }
})();
</script>
</body>
</html>
